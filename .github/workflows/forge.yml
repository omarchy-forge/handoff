name: Plugin checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Forge v0.3.0 checks
        uses: omarchy-forge/forge/action@v0.3.0
        with:
          version: v0.3.0
          path: .
      - name: Check release candidate
        run: ./scripts/release-check 0.2.0
